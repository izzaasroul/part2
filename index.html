
<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ffb6c1;
  font-family:sans-serif;
  overflow:hidden;
}

.card{
  text-align:center;
  animation:fadeIn 2s;
}

img{
  width:200px;
  border-radius:20px;
}

h1{
  color:white;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(50px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="card">
  <img src="foto.jpg">
  <h1>Selamat Ulang Tahun 🎉</h1>
  <p>Semoga panjang umur dan bahagia selalu ❤️</p>
</div>

<audio autoplay loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

</body>
</html>
